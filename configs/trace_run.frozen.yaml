dataset_dir: ../../CanyonBench-data/generated
output_dir: ../../CanyonBench-data/runs/openrouter
prompt_file: trace_prompts.yaml
tiers:
- A
- B
- C
analyses:
- main
models:
- id: openai/gpt-5.6-sol
  benchmark_role: proprietary
  provider: OpenAI
  adapter: &id001
    kind: openai_compatible
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    timeout_s: 180
    max_retries: 0
  image_max_side: 768
  supports_json_schema: true
  metered: true
  input_per_million_usd: 2.0
  output_per_million_usd: 10.0
  max_tokens: 4096
- id: anthropic/claude-opus-5
  benchmark_role: proprietary
  provider: Anthropic
  adapter: *id001
  image_max_side: 768
  supports_json_schema: true
