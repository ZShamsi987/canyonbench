dataset_dir: ../../CanyonBench-data/generated
output_dir: ../../CanyonBench-data/runs/example
prompt_file: trace_prompts.yaml
tiers: [A, B, C]
analyses: [main]

# Replace these role placeholders with the frozen roster immediately before the
# registered run. Use three proprietary vendors, three open-weight sizes (one
# pointing-capable), one or two remote-sensing VLMs, and one detector/segmenter.
models:
  - id: proprietary_vendor_a
    benchmark_role: proprietary
    provider: vendor_a
    adapter:
      kind: openai_compatible
      base_url: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
      timeout_s: 180
      max_retries: 0
    image_max_side: 768
    supports_json_schema: true
    metered: true
    input_per_million_usd: 10.0   # conservative placeholder; replace at freeze
    output_per_million_usd: 30.0  # conservative placeholder; replace at freeze
  - id: proprietary_vendor_b
    benchmark_role: proprietary
    provider: vendor_b
    adapter:
      kind: openai_compatible
      base_url: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
      timeout_s: 180
      max_retries: 0
    image_max_side: 768
    supports_json_schema: true
    metered: true
    input_per_million_usd: 10.0
    output_per_million_usd: 30.0
  - id: proprietary_vendor_c
    benchmark_role: proprietary
    provider: vendor_c
    adapter:
      kind: openai_compatible
      base_url: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
      timeout_s: 180
      max_retries: 0
    image_max_side: 768
    supports_json_schema: true
    metered: true
    input_per_million_usd: 10.0
    output_per_million_usd: 30.0
  - id: open_weight_small
    benchmark_role: open_weight
    adapter:
      kind: openai_compatible
      base_url: http://127.0.0.1:8000/v1
      api_key_env: VLLM_API_KEY
      max_retries: 0
    image_max_side: 768
    supports_json_schema: true
    metered: false
  - id: open_weight_medium
    benchmark_role: open_weight
    adapter:
      kind: openai_compatible
      base_url: http://127.0.0.1:8000/v1
      api_key_env: VLLM_API_KEY
      max_retries: 0
    image_max_side: 768
    supports_json_schema: true
    supports_pointing: true
    metered: false
  - id: open_weight_large
    benchmark_role: open_weight
    adapter:
      kind: openai_compatible
      base_url: http://127.0.0.1:8000/v1
      api_key_env: VLLM_API_KEY
      max_retries: 0
    image_max_side: 768
    supports_json_schema: true
    metered: false
  - id: remote_sensing_vlm
    benchmark_role: remote_sensing
    adapter:
      kind: openai_compatible
      base_url: http://127.0.0.1:8001/v1
      api_key_env: VLLM_API_KEY
      max_retries: 0
    image_max_side: 768
    supports_json_schema: true
    metered: false
  - id: non_language_detector
    benchmark_role: detector
    adapter:
      kind: http_detector
      base_url: http://127.0.0.1:8010
      max_retries: 0
    image_max_side: 768
    supports_json_schema: true
    metered: false

budget:
  max_requests: 60000
  max_cost_usd: 300.0
  input_per_million_usd: 0.0
  output_per_million_usd: 0.0

protocol:
  grid_sizes: [4, 6, 8]
  cell_budgets: [3, 6, 10]
  screening_views: 960
  causal_core_views: 160
  prompt_cave_views: 120
  robustness_views: 80
  parse_retries: 3
  seed: 2026

interventions:
  operators: [blur, texture, frequency, inpaint]
  fractions: [0.25, 0.5, 0.75, 1.0]
  feather_px: 5
  random_candidates: 256
  maximum_match_smd: 0.25
  seed: 2026
