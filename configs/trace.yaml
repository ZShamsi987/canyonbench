schema_version: 4.0.0

dataset:
  source_root: ../../CanyonBench-data/sources
  output_root: ../../CanyonBench-data/generated
  site_manifest: ../../CanyonBench-data/manifests/sites.yaml
  quality_calibration: ../../CanyonBench-data/calibration/flight-quality.json
  seed: 2026
  width_px: 1024
  height_px: 1024
  horizontal_fov_deg: 40.0
  altitudes_agl_m: [3000.0, 8000.0, 16000.0, 24000.0]
  geometries: [nadir, oblique]
  oblique_pitch_deg: 20.0
  # The maximum 24 km oblique footprint is approximately 20.2 km wide.
  # 22 km prevents cross-split footprint overlap with geometric margin.
  minimum_site_separation_m: 22000.0
  degraded_view_count: 240
  quotas:
    # FEASIBILITY-DRIVEN PREREGISTRATION CLARIFICATION, frozen 2026-08-23, and
    # disclosed in the composition table alongside the Group A water-negative
    # decision. TIGER returns zero primary roads and twelve secondary segments
    # across the whole flight corridor - six named US highways. Under the
    # registered 22 km separation that supports ten road-positive candidates, of
    # which seven pass G1-G4, so an eleventh site does not exist to acquire. The
    # class total stays at 20 and the dataset stays at 120 sites; only the
    # positive/negative split of this one stratum departs from balance.
    - {group: flight_corridor, per_class: 20, positive_overrides: {road: 7}}
    - {group: regional_ood, per_class: 12}
    # FEASIBILITY-DRIVEN PREREGISTRATION CLARIFICATION, frozen 2026-08-24.
    # Cross-biome water positives fail G3 on local contrast, not on size or
    # consensus: of 62 acquired candidates only one clears the 0.03 threshold
    # (0.0702), while sites carrying 40-270 km2 of water at IoU 0.6-0.75 sit at
    # 0.007-0.022. Turbid plains and wetland water is close to the brightness of
    # the land around it; the threshold was calibrated on canyon reservoir water
    # against red rock. Acquiring more returns more low-contrast water, so the
    # class total stays at 8 with a 3/5 split.
    - {group: cross_biome, per_class: 8, positive_overrides: {water: 3}}
  split_fractions:
    development: 0.2
    validation: 0.2
    test: 0.6
  gates:
    # NHD/TIGER are versioned 2025 snapshots while complete flight-corridor
    # NAIP coverage is 2021. Five years is a fixed, pre-inference ceiling for
    # these comparatively stable vector classes; cultivated fields retain the
    # separate 550-day ceiling below.
    maximum_date_gap_days: 1826
    field_maximum_date_gap_days: 550
    consensus_tolerance_m: 12.0
    minimum_consensus_fraction: 0.5
    negative_safety_buffer_m: 30.0
    minimum_apparent_width_px: 1.0
    road_minimum_apparent_width_px: 2.0
    extinction_width_px: 1.0
    minimum_component_px: 4
    minimum_boundary_distance_px: 2.0
    minimum_local_contrast: 0.03
    maximum_occlusion_fraction: 0.25
    exclusion_detector_min_score: 0.25

interventions:
  operators: [blur, texture, frequency, inpaint]
  fractions: [0.25, 0.5, 0.75, 1.0]
  feather_px: 5
  random_candidates: 256
  maximum_match_smd: 0.25
  seed: 2026

protocol:
  grid_sizes: [4, 6, 8]
  cell_budgets: [3, 6, 10]
  screening_views: 960
  causal_core_views: 160
  prompt_cave_views: 120
  robustness_views: 80
  parse_retries: 3
  seed: 2026
