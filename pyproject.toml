[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "canyonbench"
version = "0.1.0"
description = "Reproducible data pipeline and evaluation harness for CanyonBench"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "CanyonBench contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.27,<1",
  "imagehash>=4.3,<5",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pillow>=10,<12",
  "pydantic>=2.7,<3",
  "pyyaml>=6,<7",
  "scipy>=1.11,<2",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
registration = ["opencv-python-headless>=4.9,<5", "rasterio>=1.3,<2"]
analysis = ["matplotlib>=3.8,<4", "statsmodels>=0.14,<1", "scikit-learn>=1.4,<2"]
open-weight = ["transformers>=4.45,<5", "torch>=2.2,<3"]
dev = [
  "hatch>=1.12,<2",
  "mypy>=1.10,<2",
  "pandas-stubs>=2.2",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.5,<1",
  "types-pyyaml>=6",
]
all = [
  "canyonbench[registration,analysis,open-weight,dev]",
]

[project.scripts]
canyonbench = "canyonbench.cli:app"

[project.urls]
Homepage = "https://github.com/ZShamsi987/canyonbench"
Repository = "https://github.com/ZShamsi987/canyonbench"
Issues = "https://github.com/ZShamsi987/canyonbench/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/canyonbench"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["canyonbench"]
omit = [
  "src/canyonbench/__main__.py",
  "src/canyonbench/cli.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
